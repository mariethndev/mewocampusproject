<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver un vélo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>

        <div class="contientVelo">
            <h1>Réserver votre vélo pour la balade</h1>
           
            <div class="contientInfos">
                <p class="texteStation">
                    À la station : 
                    <span class="stationName"></span></p>
                <div class="depart">
                <p>
                    Départ à :
                    <span class="heureDepart"></span></p>
                </div>
            </div>
        </div>

        <div class="contenantVelos flex">

            <div class="veloCarte">
                <div class="modele">
                    <img src="./vtt.jpg" alt="image du vtt">
                </div>
                <p>Nom : <span class="nomVelo statutVelo">Urbain Pro</span></p>
                <p>Réservé par : <span class="reservePar"></span></p>
                <p>Référence : <span class="refVelo"></span></p>
                <button class="btnReserver">
                    Réserver
                </button>
            </div>

            <div class="veloCarte">
                <div class="modele">
                    <img src="./vtt.jpg" alt="image du vtt">
                </div>
                <p>Nom : <span class="nomVelo statutVelo">VTT Électrique</span></p>
                <p>Réservé par : <span class="reservePar"></span></p>
                <p>Référence : <span class="refVelo"></span></p>
                <button class="btnReserver">
                    Réserver
                </button>
            </div>

            <div class="veloCarte">
                <div class="modele">
                    <img src="./vtt.jpg" alt="image du vtt">
                </div>
                <p>Nom : <span class="nomVelo statutVelo">Cargo</span></p>
                <p>Réservé par : <span class="reservePar"></span></p>
                <p>Référence : <span class="refVelo"></span></p>
                <button class="btnReserver">
                    Réserver
                </button>
            </div>
        </div>
        
        <div class="contenuMsgReservation">
            <p class="msgFinal"></p>
        </div>
    </main>
    
    <script src="index.js"></script>
</body>
</html>
