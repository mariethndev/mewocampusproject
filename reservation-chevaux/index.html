<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation chevaux</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main>
        <header>
            <h1>Réserver votre cheval pour le cours</h1>
            <!-- date récupéré en js ici -->
            <p> du : <span id="dateDuCours"> </span> </p> 
            <p> à : <span id="heureDuCours"></span> </p>
            <!-- nom du moniteur récupérer en js -->
           <p> Moniteur(trice) : <span id="moniteurNom"></span> </p>
           
        </header>

        <section class="selectionChevaux">

            <!-- cartes des 4 chevaux -->
            <div class="chevaux disponible">
                <img src="./chimene.jpg" alt="Chimène" class="imgCheval">
                <h2 class="nomCheval">Chimène</h2>
                <p class="msgStatut">Disponible</p>
                <p class="reserverPar"></p>

                <div class="contientBtnReserver">
                    <button class="btnReserver">
                     Réserver
                    </button>
                </div>
            </div>
       
            <div class="chevaux disponible">
                <img src="./framboise.jpg" alt="Framboise" class="imgCheval">
                <h2 class="nomCheval">Framboise</h2>
                <p class="msgStatut">Disponible</p>
                <p class="reserverPar"></p>

                <div class="contientBtnReserver">
                    <button class="btnReserver">
                     Réserver
                    </button>
                </div>
            </div>

            <div class="chevaux disponible">
                <img src="./indigo.jpg" alt="Indigo" class="imgCheval">
                <h2 class="nomCheval">Indigo</h2>
                <p class="msgStatut">Disponible</p>
                <p class="reserverPar"></p>

                <div class="contientBtnReserver">
                    <button class="btnReserver">
                     Réserver
                    </button>
                </div>
            </div>

            <div class="chevaux">
                <img src="./inca.jpg" alt="Inca" class="imgCheval">
                <h2 class="nomCheval">Inca</h2>
                <p class="msgStatutReserve">Indisponible</p>
                <p class="reserverPar"></p>

                <div class="contientBtnReserver">
                    <button 
                    class="indisponible"
                    disabled>
                     Réserver
                    </button>
                </div>
            </div>

        </section>
 
        <p id="msgConfirmation"></p>
    </main>

    <script src="index.js"></script>
</body>
</html>
